loomx.loom_version = "1.18-SNAPSHOT"

[mod]
id = "beautify"
name = "Beautify"
group = "io.github.suel_ki"
version = "3.6.0"
channel_tag = ""
description = "Adds lots of vanilla-styled ways to spice up your builds."
authors = ["Suel_ki"]
contributors = []
inception_year = "2023"
license.name = "MIT"
license.url = "https://opensource.org/licenses/MIT"
license.dist = "repo"
environment = "client_and_server"
sources_url = "https://github.com/Suel-ki/beautify-stonecutter"
homepage_url = "https://github.com/Suel-ki/beautify-stonecutter"
issues_url = "https://github.com/Suel-ki/beautify-stonecutter/issues"
discord_url = ""
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+UseZGC",
	"-XX:+HeapDumpOnOutOfMemoryError",
	"-XX:HeapDumpPath=heapdump.hprof",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-XX:+UseCompactObjectHeaders",
	"-XX:+AlwaysPreTouch",
	"-XX:+UseStringDeduplication",
	"-Dfile.encoding=UTF-8"
]

