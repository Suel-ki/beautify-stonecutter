name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          read -r VERSION CHANNEL_TAG < <(python3 -c '
          import tomllib

          with open("stonecutter.properties.toml", "rb") as f:
              mod = tomllib.load(f).get("mod", {})

          print(mod.get("version", ""), mod.get("channel_tag", ""))
          ')
          EXPECTED="${VERSION}${CHANNEL_TAG}"

          if [[ -z "$EXPECTED" ]]; then
            echo "::error::Could not read [mod].version from stonecutter.properties.toml."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="$EXPECTED"
            echo "Manual run: using tag '$TAG' from stonecutter.properties.toml."
          else
            TAG="${GITHUB_REF_NAME#v}"
            echo "Validating tag '$TAG' against version '$EXPECTED'..."
            if [[ "$TAG" != "$EXPECTED" ]]; then
              echo "::error::Tag '$TAG' does not match version '$EXPECTED' in stonecutter.properties.toml."
              exit 1
            fi
            echo "✓ Tag matches version."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, reusing it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  release:
    name: Release (${{ matrix.loader }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, neoforge ]
    env:
      MOD_IS_RELEASE: true
      PUB_LOADER: ${{ matrix.loader }}
      # Fabric and NeoForge are separate publishing projects; their project ids live in the repository Variables
      PUB_MODRINTH_PROJECT_ID: ${{ matrix.loader == 'fabric' && vars.PUB_MODRINTH_PROJECT_ID_FABRIC || vars.PUB_MODRINTH_PROJECT_ID_NEOFORGE }}
      PUB_CURSEFORGE_PROJECT_ID: ${{ matrix.loader == 'fabric' && vars.PUB_CURSEFORGE_PROJECT_ID_FABRIC || vars.PUB_CURSEFORGE_PROJECT_ID_NEOFORGE }}
      # Only the fabric job creates the GitHub Release so the two jobs do not race for the same release
      PUB_GITHUB_ENABLE: ${{ matrix.loader == 'fabric' && vars.PUB_GITHUB_ENABLE || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare git-cliff
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          sed -i "s|%%%repo_url%%%|${REPO_URL}|g" cliff.toml

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output CHANGELOG.md
          version: 'v2.13.1'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PUB_DRY_RUN: ${{ vars.PUB_DRY_RUN }}
          PUB_MODS_ENABLE: ${{ vars.PUB_MODS_ENABLE }}
          PUB_MAVEN_ENABLE: ${{ vars.PUB_MAVEN_ENABLE }}
          PUB_MAVEN_CENTRAL_ENABLE: ${{ vars.PUB_MAVEN_CENTRAL_ENABLE }}
          PUB_MAVEN_CENTRAL_SNAPSHOTS: ${{ vars.PUB_MAVEN_CENTRAL_SNAPSHOTS }}
          PUB_MODRINTH_STAGING: ${{ vars.PUB_MODRINTH_STAGING }}
          PUB_MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_KEY }}
          PUB_CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_API_KEY }}
          PUB_SIGNING_KEY: ${{ secrets.PUB_SIGNING_KEY }}
          PUB_SIGNING_ID: ${{ secrets.PUB_SIGNING_ID }}
          PUB_SIGNING_PASSWORD: ${{ secrets.PUB_SIGNING_PASSWORD }}
          PUB_MAVEN_CENTRAL_USERNAME: ${{ secrets.PUB_MAVEN_CENTRAL_USERNAME }}
          PUB_MAVEN_CENTRAL_PASSWORD: ${{ secrets.PUB_MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew publishMods --no-daemon --stacktrace --console=plain
